<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#faf8fc">
<title>AURA — Your Aesthetic World</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf8fc;--card:#fff;--text:#272333;--muted:#928b9c;--pink:#e9b6d0;--purple:#a995ce;--line:#eee9f2;--accent:#ad87b9}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;max-width:600px;margin:auto;min-height:100vh;padding-bottom:82px}
button,input,textarea{font:inherit}
button{cursor:pointer}
header{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:10;background:#faf8fcf2;border-bottom:1px solid var(--line)}
.logo{font-family:'Playfair Display',serif;font-size:27px;letter-spacing:3px}
.header-icons{display:flex;gap:16px}
.header-icons button{border:0;background:none;color:var(--text);font-size:23px}
.page{display:none;padding:20px}
.page.active{display:block}
.heading{font-family:'Playfair Display',serif;font-size:29px;margin:8px 0 5px}
.sub{color:var(--muted);font-size:13px;margin-bottom:20px}
.stories{display:flex;gap:16px;overflow-x:auto;padding:10px 0 20px}
.story{min-width:65px;text-align:center;font-size:11px}
.story img{width:61px;height:61px;border-radius:50%;object-fit:cover;padding:3px;border:2px solid var(--pink)}
.post{background:var(--card);border:1px solid var(--line);border-radius:19px;overflow:hidden;margin-bottom:23px}
.post-user{display:flex;align-items:center;gap:10px;padding:13px}
.avatar{width:39px;height:39px;border-radius:50%;object-fit:cover;background:#eee}
.user-info{flex:1}
.user-info strong{font-size:13px}
.user-info small{display:block;color:var(--muted);font-size:11px}
.follow{border:0;background:#f5eaf2;color:#a05f8d;padding:8px 14px;border-radius:20px;font-weight:700}
.post-image{width:100%;max-height:520px;min-height:180px;object-fit:cover;display:block}
.post-actions{display:flex;align-items:center;gap:17px;padding:12px 14px}
.action{border:0;background:none;font-size:23px;color:var(--text)}
.action.liked{color:#ed729f}
.caption{padding:0 14px 13px;font-size:13px;line-height:1.6}
.comment-list{padding:0 14px 10px;font-size:12px}
.comment-form{display:flex;gap:7px;padding:0 14px 14px}
.comment-form input{flex:1;min-width:0;border:1px solid var(--line);border-radius:20px;padding:9px 12px;background:var(--bg);color:var(--text)}
.comment-form button{border:0;background:none;color:#a05f8d;font-weight:700}
.search,.field{width:100%;padding:13px 15px;border-radius:13px;border:1px solid var(--line);background:var(--card);color:var(--text);margin:10px 0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid img,.grid video{width:100%;height:210px;object-fit:cover;border-radius:14px}
.profile-top{text-align:center;padding:20px 0}
.profile-pic{width:105px;height:105px;border-radius:50%;object-fit:cover}
.profile-name{font-size:22px;font-weight:700;margin-top:12px}
.profile-bio{color:var(--muted);font-size:13px;margin:7px}
.stats{display:flex;justify-content:center;gap:35px;margin:24px}
.stats strong{display:block;font-size:20px}
.stats small{color:var(--muted)}
.edit,.primary{background:#ad87b9;color:white;border:0;border-radius:12px;padding:12px 22px;font-weight:700;margin:5px}
.bottom{position:fixed;bottom:0;left:0;right:0;max-width:600px;margin:auto;height:70px;background:#ffffffed;border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;z-index:20}
.nav{border:0;background:none;font-size:24px;color:#a39aaa}
.nav.active{color:#b276ad}
.create-box{background:var(--card);border:1px dashed #cbb4d5;padding:25px 18px;text-align:center;border-radius:20px;margin-top:20px}
.create-box textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;margin-top:15px;background:var(--bg);color:var(--text);min-height:85px}
.create-box input[type=file]{display:none}
.empty{text-align:center;padding:38px 10px;color:var(--muted)}
.hidden{display:none!important}
#authScreen{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
.auth-card{width:100%;max-width:390px;background:var(--card);padding:25px;border-radius:23px;border:1px solid var(--line)}
.auth-logo{text-align:center;font-family:'Playfair Display',serif;font-size:36px;letter-spacing:4px}
.auth-card h2{text-align:center;font-family:'Playfair Display',serif;margin:10px}
.auth-card p{text-align:center;color:var(--muted);font-size:13px;margin-bottom:15px}
.auth-card input{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;margin:6px 0;background:var(--bg);color:var(--text)}
.auth-card button{width:100%;margin-top:9px}
.auth-switch{text-align:center;margin-top:16px;font-size:13px}
.auth-switch span{color:#a05f8d;font-weight:700;cursor:pointer}
#message{font-size:12px;color:#a05f8d;margin-top:12px;text-align:center}
.dark{--bg:#17151d;--card:#24212b;--text:#f7f0fa;--muted:#aaa0b3;--line:#36303d}
.dark header,.dark .bottom{background:#211e28ed}
.chat-row{display:flex;align-items:center;gap:11px;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin:8px 0;width:100%;color:var(--text);text-align:left}
.chat-row img{width:43px;height:43px;border-radius:50%;object-fit:cover}
.chat-panel{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.chat-head{padding:12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.chat-messages{height:48vh;min-height:280px;overflow:auto;padding:13px;display:flex;flex-direction:column;gap:9px}
.bubble{max-width:82%;padding:10px 12px;border-radius:15px;background:#f0eaf4;align-self:flex-start;overflow-wrap:anywhere;font-size:13px}
.bubble.mine{background:#dfc8e6;align-self:flex-end;color:#30233a}
.bubble small{display:block;font-size:10px;margin-top:5px}
.chat-compose{display:flex;gap:6px;padding:10px;border-top:1px solid var(--line)}
.chat-compose input{min-width:0;flex:1;border:1px solid var(--line);border-radius:20px;padding:10px;background:var(--bg);color:var(--text)}
.chat-compose button{border:0;border-radius:20px;padding:0 13px;background:#ad87b9;color:#fff}
@media(min-width:601px){body{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
</style>
</head>
<body>

<div id="authScreen">
<div class="auth-card">
<div class="auth-logo">AURA.</div>
<h2 id="authTitle">Welcome to AURA</h2>
<p id="authSubtitle">Your little world starts here ✨</p>

<select id="authMethod" class="field">
<option value="email">Email</option>
<option value="phone">Phone number</option>
</select>

<div id="signupName" class="hidden">
<input id="fullName" placeholder="Your full name">
<input id="username" placeholder="Choose a username">
</div>

<input id="email" type="email" placeholder="Email address">
<input id="phone" class="hidden" type="tel" placeholder="+8801XXXXXXXXX">
<input id="password" type="password" placeholder="Password (8+ characters)">

<div id="otpBox" class="hidden">
<input id="otp" inputmode="numeric" maxlength="6" placeholder="6-digit verification code">
<button class="primary" id="verifyOtpButton">Verify code</button>
</div>

<button class="primary" id="authButton">Login</button>
<button class="edit" id="forgotButton">Forgot password?</button>
<div id="message"></div>
<div class="auth-switch"><span id="switchText">Create an account</span></div>
</div>
</div>

<header>
<div class="logo">AURA.</div>
<div class="header-icons">
<button id="themeButton">☾</button>
<button id="inboxButton">✉</button>
</div>
</header>

<section class="page active" id="home">
<div class="heading">Your little world ✨</div>
<div class="sub">A place for beautiful things.</div>
<div class="stories" id="stories"></div>
<div id="feed"></div>
</section>

<section class="page" id="explore">
<div class="heading">Explore</div>
<div class="sub">Find your kind of beauty.</div>
<input class="search" id="search" placeholder="Search posts">
<div class="grid" id="gallery"></div>
</section>

<section class="page" id="create">
<div class="heading">Create something</div>
<div class="create-box">
<textarea id="captionInput" placeholder="Write a caption..."></textarea>
<label class="primary">＋ Choose Photo / Video
<input type="file" accept="image/*,video/*" id="upload">
</label>
<p id="uploadStatus"></p>
<hr>
<h3>Share a Story</h3>
<label class="primary">＋ Choose Story
<input type="file" accept="image/*,video/*" id="storyUpload">
</label>
</div>
</section>

<section class="page" id="inbox">
<div class="heading">Messages</div>
<input class="search" id="peopleSearch" placeholder="Find a person by username">
<div id="peopleResults"></div>
<div id="chatList"></div>
<div id="chatRoom" class="hidden chat-panel">
<div class="chat-head">
<button id="backChats">‹</button>
<img id="chatAvatar" class="avatar" alt="">
<strong id="chatName">Chat</strong>
</div>
<div id="chatMessages" class="chat-messages"></div>
<form id="chatForm" class="chat-compose">
<input id="chatText" type="text" placeholder="Write a message...">
<button type="submit">Send</button>
</form>
</div>
</section>

<section class="page" id="profile">
<div class="profile-top">
<img class="profile-pic" id="myPic" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=300">
<div class="profile-name" id="myName">AURA User</div>
<p class="profile-bio" id="myBio"></p>
<div class="stats">
<div><strong id="postCount">0</strong><small>Posts</small></div>
<div><strong id="followerCount">0</strong><small>Followers</small></div>
<div><strong id="followingCount">0</strong><small>Following</small></div>
</div>
<button class="edit" id="editProfileButton">Edit Profile</button>
<button class="edit" id="changePasswordButton">Change Password</button>
<button class="edit" id="logoutButton">Log out</button>
</div>
<div class="grid" id="myPosts"></div>
</section>

<nav class="bottom">
<button class="nav active" data-page="home">⌂</button>
<button class="nav" data-page="explore">⌕</button>
<button class="nav" data-page="create">⊕</button>
<button class="nav" data-page="inbox">✉</button>
<button class="nav" data-page="profile">◉</button>
</nav><script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const SUPABASE_URL = "https://lntvyexkbxlfimlhjpvg.supabase.co";
const SUPABASE_KEY = "sb_publishable_NyDoKcsBtd8LTKuyv-8Jag_xXqV9nAv";
const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null;
let currentProfile = null;
let activeConversation = null;
let activeChatUser = null;
let authMode = "login";
let otpMode = false;
let resendTimer = null;
let presenceChannel = null;
let messageChannel = null;

const $ = id => document.getElementById(id);
const show = (id, visible = true) => {
  const el = $(id);
  if (el) el.style.display = visible ? "" : "none";
};
const setText = (id, value) => {
  if ($(id)) $(id).textContent = value ?? "";
};
const escapeHTML = value => String(value ?? "").replace(/[&<>"']/g, c => ({
  "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
}[c]));
const notify = message => {
  if ($("message")) {
    $("message").textContent = message;
    $("message").style.display = "block";
  } else {
    alert(message);
  }
};
const fileURL = path =>
  supabase.storage.from("aura-media").getPublicUrl(path).data.publicUrl;

async function getSession() {
  const { data } = await supabase.auth.getSession();
  currentUser = data.session?.user || null;
  if (currentUser) await startApp();
  else showAuth();
}

function showAuth() {
  show("authScreen", true);
  ["home","explore","create","inbox","profile"].forEach(id => show(id, false));
  document.querySelectorAll(".bottom").forEach(el => el.style.display = "none");
}

function showAppPage(page) {
  ["home","explore","create","inbox","profile"].forEach(id => show(id, id === page));
  document.querySelectorAll(".nav").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.page === page);
  });
}

document.querySelectorAll(".nav").forEach(button => {
  button.addEventListener("click", async () => {
    const page = button.dataset.page;
    if (!page) return;
    showAppPage(page);
    if (page === "home") await loadFeed();
    if (page === "explore") await loadExplore();
    if (page === "inbox") await loadChats();
    if (page === "profile") await loadMyProfile();
  });
});

if ($("themeButton")) {
  $("themeButton").addEventListener("click", () => {
    document.body.classList.toggle("dark");
    localStorage.setItem("aura-theme",
      document.body.classList.contains("dark") ? "dark" : "light");
  });
}
if (localStorage.getItem("aura-theme") === "dark") {
  document.body.classList.add("dark");
}

if ($("inboxButton")) {
  $("inboxButton").addEventListener("click", async () => {
    showAppPage("inbox");
    await loadChats();
  });
}

/* AUTHENTICATION */

function setAuthMode(mode) {
  authMode = mode;
  otpMode = false;
  show("otpBox", false);
  setText("authTitle", mode === "signup" ? "Create Account" : "Welcome Back");
  setText("authSubtitle", mode === "signup"
    ? "Join your aesthetic world"
    : "Sign in to your AURA account");
  show("signupName", mode === "signup");
  show("fullName", mode === "signup");
  show("username", mode === "signup");
  setText("authButton", mode === "signup" ? "Create Account" : "Sign In");
  setText("switchText", mode === "signup"
    ? "Already have an account? Sign in"
    : "New to AURA? Create account");
  if ($("authButton")) $("authButton").textContent =
    mode === "signup" ? "Create Account" : "Sign In";
}

if ($("switchText")) {
  $("switchText").addEventListener("click", () => {
    setAuthMode(authMode === "login" ? "signup" : "login");
  });
}

function validPassword(password) {
  return password.length >= 8 &&
    /[A-Z]/.test(password) &&
    /[a-z]/.test(password) &&
    /\d/.test(password) &&
    /[^A-Za-z0-9]/.test(password);
}

if ($("authButton")) {
  $("authButton").addEventListener("click", async () => {
    const method = $("authMethod")?.value || "email";
    const password = $("password")?.value || "";
    const email = $("email")?.value.trim() || "";
    const phone = $("phone")?.value.trim() || "";

    if (authMode === "signup" && !validPassword(password)) {
      notify("Password must be 8+ characters and include uppercase, lowercase, number and symbol.");
      return;
    }

    if (method === "phone" && !phone) {
      notify("Enter your phone number.");
      return;
    }
    if (method === "email" && !email) {
      notify("Enter your email address.");
      return;
    }
    if (!password) {
      notify("Enter your password.");
      return;
    }

    const button = $("authButton");
    button.disabled = true;
    button.textContent = "Please wait...";

    try {
      if (authMode === "signup") {
        const payload = method === "phone"
          ? { phone, password }
          : { email, password };

        const { data, error } = await supabase.auth.signUp({
          ...payload,
          options: {
            data: {
              full_name: $("fullName")?.value.trim() || "",
              username: $("username")?.value.trim() || ""
            }
          }
        });
        if (error) throw error;

        if (method === "phone") {
          notify("Account request submitted. Phone verification requires a configured SMS provider.");
        } else if (data.session) {
          currentUser = data.user;
          await startApp();
        } else {
          notify("Account created. Check your email for the confirmation message.");
        }
      } else {
        const payload = method === "phone"
          ? { phone, password }
          : { email, password };

        const { data, error } = await supabase.auth.signInWithPassword(payload);
        if (error) throw error;
        currentUser = data.user;
        await startApp();
      }
    } catch (error) {
      notify(error.message || "Authentication failed.");
    } finally {
      button.disabled = false;
      button.textContent = authMode === "signup" ? "Create Account" : "Sign In";
    }
  });
}

if ($("forgotButton")) {
  $("forgotButton").addEventListener("click", async () => {
    const email = $("email")?.value.trim();
    if (!email) return notify("Enter your email first.");
    const { error } = await supabase.auth.resetPasswordForEmail(email, {
      redirectTo: location.href
    });
    if (error) notify(error.message);
    else notify("Password reset instructions have been sent if the email is registered.");
  });
}

if ($("verifyOtpButton")) {
  $("verifyOtpButton").addEventListener("click", async () => {
    const token = $("otp")?.value.trim();
    const email = $("email")?.value.trim();
    const phone = $("phone")?.value.trim();
    const method = $("authMethod")?.value || "email";
    if (!token) return notify("Enter the verification code.");

    const payload = method === "phone"
      ? { phone, token, type: "sms" }
      : { email, token, type: "email" };

    const { data, error } = await supabase.auth.verifyOtp(payload);
    if (error) return notify(error.message);
    currentUser = data.user;
    await startApp();
  });
}

/* APP START */

async function startApp() {
  if (!currentUser) return showAuth();
  show("authScreen", false);
  document.querySelectorAll(".bottom").forEach(el => el.style.display = "flex");
  await ensureProfile();
  await loadFeed();
  await loadStories();
  showAppPage("home");
  startPresence();
}

async function ensureProfile() {
  const { data } = await supabase
    .from("profiles")
    .select("*")
    .eq("id", currentUser.id)
    .maybeSingle();

  if (data) {
    currentProfile = data;
  } else {
    const metadata = currentUser.user_metadata || {};
    const username = metadata.username ||
      (currentUser.email?.split("@")[0]) ||
      ("user" + currentUser.id.slice(0, 6));

    const profile = {
      id: currentUser.id,
      username,
      full_name: metadata.full_name || username,
      bio: ""
    };

    const { data: created, error } = await supabase
      .from("profiles")
      .upsert(profile)
      .select()
      .single();

    if (!error) currentProfile = created;
  }
}

/* STORIES */

async function loadStories() {
  if (!currentUser || !$("stories")) return;
  const { data, error } = await supabase
    .from("stories")
    .select("*")
    .order("created_at", { ascending: false })
    .limit(30);

  if (error) {
    $("stories").innerHTML = "";
    return;
  }

  $("stories").innerHTML = (data || []).map(story => `
    <div class="story" onclick="window.open('${escapeHTML(story.media_url || "")}','_blank')">
      <img src="${escapeHTML(story.media_url || "")}" alt="Story">
      <span>Story</span>
    </div>
  `).join("");
}

if ($("storyUpload")) {
  $("storyUpload").addEventListener("change", async event => {
    const file = event.target.files?.[0];
    if (!file || !currentUser) return;
    try {
      const path = `stories/${currentUser.id}/${Date.now()}-${file.name}`;
      const { error: uploadError } = await supabase.storage
        .from("aura-media").upload(path, file);
      if (uploadError) throw uploadError;

      const { error } = await supabase.from("stories").insert({
        user_id: currentUser.id,
        media_url: fileURL(path)
      });
      if (error) throw error;
      notify("Story uploaded!");
      await loadStories();
    } catch (error) {
      notify(error.message);
    }
    event.target.value = "";
  });
}

/* FEED AND POSTS */

async function loadFeed() {
  if (!$("feed")) return;
  $("feed").innerHTML = "<p>Loading posts...</p>";

  const { data, error } = await supabase
    .from("posts")
    .select("*")
    .order("created_at", { ascending: false })
    .limit(50);

  if (error) {
    $("feed").innerHTML = `<p>${escapeHTML(error.message)}</p>`;
    return;
  }

  if (!data?.length) {
    $("feed").innerHTML = "<p>No posts yet. Be the first to share something!</p>";
    return;
  }

  const userIds = [...new Set(data.map(post => post.user_id))];
  const postIds = data.map(post => post.id);

  const [{ data: profiles }, { data: likes }, { data: comments }] =
    await Promise.all([
      supabase.from("profiles").select("id,username,full_name,avatar_url")
        .in("id", userIds),
      supabase.from("likes").select("post_id,user_id").in("post_id", postIds),
      supabase.from("comments").select("id,post_id,user_id,content,created_at")
        .in("post_id", postIds).order("created_at", { ascending: true })
    ]);

  const profileMap = Object.fromEntries((profiles || []).map(p => [p.id, p]));
  $("feed").innerHTML = data.map(post => {
    const author = profileMap[post.user_id] || {};
    const postLikes = (likes || []).filter(l => l.post_id === post.id);
    const postComments = (comments || []).filter(c => c.post_id === post.id);
    const liked = postLikes.some(l => l.user_id === currentUser.id);
    const media = post.media_url
      ? (post.media_type === "video"
        ? `<video src="${escapeHTML(post.media_url)}" controls></video>`
        : `<img src="${escapeHTML(post.media_url)}" alt="Post image">`)
      : "";

    return `
      <article class="post" data-post="${post.id}">
        <div class="post-head">
          <img class="avatar" src="${escapeHTML(author.avatar_url || "https://placehold.co/48")}" alt="">
          <strong>${escapeHTML(author.username || "AURA user")}</strong>
        </div>
        ${media}
        <div class="post-actions">
          <button onclick="window.auraLike('${post.id}')">${liked ? "♥" : "♡"} ${postLikes.length}</button>
          <button onclick="document.getElementById('comment-${post.id}').focus()">Comment</button>
        </div>
        <p>${escapeHTML(post.caption || "")}</p>
        <div class="comments">
          ${postComments.map(c => `<p><b>${escapeHTML(profileMap[c.user_id]?.username || "User")}</b> ${escapeHTML(c.content)}</p>`).join("")}
        </div>
        <form onsubmit="window.auraComment(event,'${post.id}')">
          <input id="comment-${post.id}" placeholder="Write a comment..." maxlength="500">
          <button type="submit">Post</button>
        </form>
      </article>
    `;
  }).join("");
}

window.auraLike = async postId => {
  const { data: existing } = await supabase.from("likes")
    .select("id").eq("post_id", postId).eq("user_id", currentUser.id).maybeSingle();

  if (existing) {
    await supabase.from("likes").delete().eq("id", existing.id);
  } else {
    const { error } = await supabase.from("likes").insert({
      post_id: postId, user_id: currentUser.id
    });
    if (error) return notify(error.message);
  }
  await loadFeed();
};

window.auraComment = async (event, postId) => {
  event.preventDefault();
  const input = $("comment-" + postId);
  const content = input?.value.trim();
  if (!content) return;

  const { error } = await supabase.from("comments").insert({
    post_id: postId,
    user_id: currentUser.id,
    content
  });
  if (error) return notify(error.message);
  await loadFeed();
};

/* CREATE POST */

if ($("upload")) {
  $("upload").addEventListener("change", async event => {
    const file = event.target.files?.[0];
    if (!file || !currentUser) return;

    try {
      setText("uploadStatus", "Uploading...");
      const path = `posts/${currentUser.id}/${Date.now()}-${file.name}`;
      const { error: uploadError } = await supabase.storage
        .from("aura-media").upload(path, file);
      if (uploadError) throw uploadError;

      const { error } = await supabase.from("posts").insert({
        user_id: currentUser.id,
        caption: $("captionInput")?.value.trim() || "",
        media_url: fileURL(path),
        media_type: file.type.startsWith("video/") ? "video" : "image"
      });
      if (error) throw error;

      setText("uploadStatus", "Posted successfully!");
      if ($("captionInput")) $("captionInput").value = "";
      event.target.value = "";
      await loadFeed();
      showAppPage("home");
    } catch (error) {
      setText("uploadStatus", error.message);
    }
  });
}

/* EXPLORE AND PEOPLE SEARCH */

async function loadExplore() {
  if (!$("gallery")) return;
  const { data, error } = await supabase
    .from("posts").select("*")
    .order("created_at", { ascending: false }).limit(30);

  if (error) {
    $("gallery").innerHTML = "";
    return;
  }
  $("gallery").innerHTML = (data || []).map(post => `
    <div class="gallery-item">
      <img src="${escapeHTML(post.media_url || "")}" alt="">
    </div>
  `).join("");
}

async function searchPeople() {
  const term = $("peopleSearch")?.value.trim();
  if (!term || !$("peopleResults")) return;

  const { data, error } = await supabase
    .from("profiles").select("id,username,full_name,avatar_url")
    .ilike("username", `%${term}%`).limit(20);

  if (error) return notify(error.message);

  $("peopleResults").innerHTML = (data || [])
    .filter(person => person.id !== currentUser.id)
    .map(person => `
      <div class="person-result">
        <img class="avatar" src="${escapeHTML(person.avatar_url || "https://placehold.co/48")}" alt="">
        <span>${escapeHTML(person.username || person.full_name || "User")}</span>
        <button onclick="window.auraOpenChat('${person.id}')">Message</button>
      </div>
    `).join("") || "<p>No users found.</p>";
}

if ($("peopleSearch")) {
  $("peopleSearch").addEventListener("input", () => {
    clearTimeout(window.auraSearchTimer);
    window.auraSearchTimer = setTimeout(searchPeople, 350);
  });
}

/* PROFILE */

async function loadMyProfile() {
  if (!currentUser) return;
  const { data } = await supabase.from("profiles")
    .select("*").eq("id", currentUser.id).maybeSingle();

  if (data) currentProfile = data;
  setText("myName", currentProfile?.full_name || currentProfile?.username || "AURA user");
  setText("myBio", currentProfile?.bio || "");
  if ($("myPic")) $("myPic").src =
    currentProfile?.avatar_url || "https://placehold.co/100";

  const [{ count: posts }, { count: followers }, { count: following }] =
    await Promise.all([
      supabase.from("posts").select("*", { count: "exact", head: true })
        .eq("user_id", currentUser.id),
      supabase.from("follows").select("*", { count: "exact", head: true })
        .eq("following_id", currentUser.id),
      supabase.from("follows").select("*", { count: "exact", head: true })
        .eq("follower_id", currentUser.id)
    ]);

  setText("postCount", posts || 0);
  setText("followerCount", followers || 0);
  setText("followingCount", following || 0);

  const { data: myPosts } = await supabase.from("posts")
    .select("*").eq("user_id", currentUser.id)
    .order("created_at", { ascending: false });

  if ($("myPosts")) {
    $("myPosts").innerHTML = (myPosts || []).map(post => `
      <div class="gallery-item">
        <img src="${escapeHTML(post.media_url || "")}" alt="">
      </div>
    `).join("");
  }
}

if ($("editProfileButton")) {
  $("editProfileButton").addEventListener("click", async () => {
    const full_name = prompt("Your display name:", currentProfile?.full_name || "");
    if (full_name === null) return;
    const username = prompt("Your username:", currentProfile?.username || "");
    if (username === null) return;
    const bio = prompt("Your bio:", currentProfile?.bio || "");
    if (bio === null) return;

    const { error } = await supabase.from("profiles").upsert({
      id: currentUser.id, full_name, username, bio
    });
    if (error) notify(error.message);
    else {
      await loadMyProfile();
      notify("Profile updated!");
    }
  });
}

if ($("changePasswordButton")) {
  $("changePasswordButton").addEventListener("click", async () => {
    const password = prompt("Enter your new password:");
    if (!password) return;
    if (!validPassword(password)) {
      return notify("Use 8+ characters with uppercase, lowercase, number and symbol.");
    }
    const { error } = await supabase.auth.updateUser({ password });
    if (error) notify(error.message);
    else notify("Password updated successfully.");
  });
}

if ($("logoutButton")) {
  $("logoutButton").addEventListener("click", async () => {
    if (!confirm("Are you sure you want to log out?")) return;
    if (presenceChannel) await supabase.removeChannel(presenceChannel);
    if (messageChannel) await supabase.removeChannel(messageChannel);
    await supabase.auth.signOut();
    currentUser = null;
    currentProfile = null;
    showAuth();
  });
}

/* CHAT */

async function findOrCreateConversation(otherUserId) {
  const ids = [currentUser.id, otherUserId].sort();
  const { data: existing, error: findError } = await supabase
    .from("conversations").select("*")
    .eq("user1_id", ids[0]).eq("user2_id", ids[1]).maybeSingle();

  if (findError) throw findError;
  if (existing) return existing;

  const { data, error } = await supabase.from("conversations")
    .insert({ user1_id: ids[0], user2_id: ids[1] })
    .select().single();

  if (error) {
    const { data: retry } = await supabase.from("conversations")
      .select("*").eq("user1_id", ids[0]).eq("user2_id", ids[1])
      .maybeSingle();
    if (retry) return retry;
    throw error;
  }
  return data;
}

window.auraOpenChat = async userId => {
  try {
    const { data: person, error } = await supabase.from("profiles")
      .select("*").eq("id", userId).single();
    if (error) throw error;

    activeChatUser = person;
    activeConversation = await findOrCreateConversation(userId);
    setText("chatName", person.username || person.full_name || "Chat");
    if ($("chatAvatar")) $("chatAvatar").src =
      person.avatar_url || "https://placehold.co/48";

    show("chatList", false);
    show("chatRoom", true);
    await loadMessages();
    subscribeMessages();
  } catch (error) {
    notify(error.message);
  }
};

async function loadChats() {
  if (!currentUser || !$("chatList")) return;
  show("chatList", true);
  show("chatRoom", false);

  const { data: conversations, error } = await supabase
    .from("conversations").select("*")
    .or(`user1_id.eq.${currentUser.id},user2_id.eq.${currentUser.id}`)
    .order("created_at", { ascending: false });

  if (error) {
    $("chatList").innerHTML = `<p>${escapeHTML(error.message)}</p>`;
    return;
  }
  if (!conversations?.length) {
    $("chatList").innerHTML = "<p>No conversations yet. Find someone to message.</p>";
    return;
  }

  const otherIds = conversations.map(c =>
    c.user1_id === currentUser.id ? c.user2_id : c.user1_id
  );
  const { data: people } = await supabase.from("profiles")
    .select("id,username,full_name,avatar_url").in("id", otherIds);

  const peopleMap = Object.fromEntries((people || []).map(p => [p.id, p]));

  $("chatList").innerHTML = conversations.map(c => {
    const otherId = c.user1_id === currentUser.id ? c.user2_id : c.user1_id;
    const person = peopleMap[otherId] || {};
    return `
      <div class="chat-list-item" onclick="window.auraOpenChat('${otherId}')">
        <img class="avatar" src="${escapeHTML(person.avatar_url || "https://placehold.co/48")}" alt="">
        <strong>${escapeHTML(person.username || person.full_name || "AURA user")}</strong>
      </div>
    `;
  }).join("");
}

if ($("backChats")) {
  $("backChats").addEventListener("click", async () => {
    if (messageChannel) {
      await supabase.removeChannel(messageChannel);
      messageChannel = null;
    }
    activeConversation = null;
    activeChatUser = null;
    await loadChats();
  });
}

async function loadMessages() {
  if (!activeConversation || !$("chatMessages")) return;

  const { data, error } = await supabase.from("messages")
    .select("*").eq("conversation_id", activeConversation.id)
    .order("created_at", { ascending: true });

  if (error) {
    $("chatMessages").innerHTML = `<p>${escapeHTML(error.message)}</p>`;
    return;
  }

  $("chatMessages").innerHTML = (data || []).map(message => {
    const mine = message.sender_id === currentUser.id;
    return `
      <div class="chat-message ${mine ? "mine" : "theirs"}">
        ${message.content ? `<p>${escapeHTML(message.content)}</p>` : ""}
        ${message.image_url ? `<img src="${escapeHTML(message.image_url)}" alt="Shared image">` : ""}
        <small>${new Date(message.created_at).toLocaleString()}</small>
        ${mine ? `<button onclick="window.auraDeleteMessage('${message.id}')">Delete</button>` : ""}
      </div>
    `;
  }).join("");

  $("chatMessages").scrollTop = $("chatMessages").scrollHeight;

  const unread = (data || []).filter(m => m.sender_id !== currentUser.id);
  for (const message of unread) {
    await supabase.from("message_read").insert({
      message_id: message.id,
      user_id: currentUser.id
    });
  }
}

function subscribeMessages() {
  if (messageChannel) supabase.removeChannel(messageChannel);
  if (!activeConversation) return;

  messageChannel = supabase.channel("messages-" + activeConversation.id)
    .on("postgres_changes", {
      event: "*",
      schema: "public",
      table: "messages",
      filter: `conversation_id=eq.${activeConversation.id}`
    }, () => loadMessages())
    .subscribe();
}

if ($("chatForm")) {
  $("chatForm").addEventListener("submit", async event => {
    event.preventDefault();
    const content = $("chatText")?.value.trim();
    if (!content || !activeConversation) return;

    const { error } = await supabase.from("messages").insert({
      conversation_id: activeConversation.id,
      sender_id: currentUser.id,
      content
    });
    if (error) return notify(error.message);

    $("chatText").value = "";
    await loadMessages();
  });
}

window.auraDeleteMessage = async messageId => {
  if (!confirm("Delete this message?")) return;
  const { error } = await supabase.from("messages")
    .delete().eq("id", messageId).eq("sender_id", currentUser.id);
  if (error) notify(error.message);
  else await loadMessages();
};

/* REALTIME PRESENCE */

function startPresence() {
  if (presenceChannel) supabase.removeChannel(presenceChannel);

  presenceChannel = supabase.channel("aura-online", {
    config: { presence: { key: currentUser.id } }
  });

  presenceChannel.on("presence", { event: "sync" }, () => {
    // Online users can be read from presenceChannel.presenceState()
  }).subscribe(async status => {
    if (status === "SUBSCRIBED") {
      await presenceChannel.track({
        online_at: new Date().toISOString()
      });
    }
  });
}

/* AUTH STATE */

supabase.auth.onAuthStateChange(async (event, session) => {
  currentUser = session?.user || null;
  if (event === "SIGNED_IN" && currentUser) {
    await startApp();
  }
});

getSession();
</script>
